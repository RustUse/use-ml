use-ml-tensor.workspace = true
use-ml-model.workspace = true
use-ml-training.workspace = true
use-ml-inference.workspace = true
use-ml-evaluation.workspace = true
use-ml-metric.workspace = true
use-ml-pipeline.workspace = true
use-ml-embedding.workspace = true
use-ml-experiment.workspace = true
use-ml-model-card.workspace = true

[[example]]
name = "ml_basic_usage"
path = "examples/basic_usage.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
