[workspace]
members = [
    "crates/use-ml",
    "crates/use-ml-dataset",
    "crates/use-ml-feature",
    "crates/use-ml-label",
    "crates/use-ml-tensor",
    "crates/use-ml-model",
    "crates/use-ml-training",
    "crates/use-ml-inference",
    "crates/use-ml-evaluation",
    "crates/use-ml-metric",
    "crates/use-ml-pipeline",
    "crates/use-ml-embedding",
    "crates/use-ml-experiment",
    "crates/use-ml-model-card",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
documentation = "https://rustuse.org"
publish = false
readme = "README.md"
repository = "https://github.com/RustUse/use-ml"
rust-version = "1.95.0"
version = "0.0.1"

[workspace.dependencies]
use-ml-dataset = { version = "0.0.1", path = "crates/use-ml-dataset" }
use-ml-feature = { version = "0.0.1", path = "crates/use-ml-feature" }
use-ml-label = { version = "0.0.1", path = "crates/use-ml-label" }
use-ml-tensor = { version = "0.0.1", path = "crates/use-ml-tensor" }
use-ml-model = { version = "0.0.1", path = "crates/use-ml-model" }
use-ml-training = { version = "0.0.1", path = "crates/use-ml-training" }
use-ml-inference = { version = "0.0.1", path = "crates/use-ml-inference" }
use-ml-evaluation = { version = "0.0.1", path = "crates/use-ml-evaluation" }
use-ml-metric = { version = "0.0.1", path = "crates/use-ml-metric" }
use-ml-pipeline = { version = "0.0.1", path = "crates/use-ml-pipeline" }
use-ml-embedding = { version = "0.0.1", path = "crates/use-ml-embedding" }
use-ml-experiment = { version = "0.0.1", path = "crates/use-ml-experiment" }
use-ml-model-card = { version = "0.0.1", path = "crates/use-ml-model-card" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "allow"
float_cmp = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
return_self_not_must_use = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-ml-dataset",
    "use-ml-feature",
    "use-ml-label",
    "use-ml-tensor",
    "use-ml-model",
    "use-ml-training",
    "use-ml-inference",
    "use-ml-evaluation",
    "use-ml-metric",
    "use-ml-pipeline",
    "use-ml-embedding",
    "use-ml-experiment",
    "use-ml-model-card",
    "use-ml",
]
